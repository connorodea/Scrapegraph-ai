github:
  api_url: "https://api.github.com"
  concurrency: 6
  per_page: 100
  request_timeout_seconds: 30
  max_retries: 5
  user_agent: "juricratic-research-radar/0.1"

discovery:
  start_date: 2008-01-01
  end_date:
  max_results_per_shard: 950
  min_stars: 0
  include_forks: false
  include_archived: false
  max_queries:
  seed_repositories:
    - connorodea/bidaraciv
    - coastalcph/lex-glue
    - HazyResearch/legalbench
    - Breakend/PileOfLaw
    - The-Atticus-Project/cuad
    - openlegaldata/awesome-legal-data
    - prometheusXN/LADAN
