    - DUTIR-LegalIntelligence/LegalLJP
    - SUSTech-TP/Legal_Judgment_Prediction_CN
    - NEUIR/LegalDuet
    - haoxizhong/law_pre

snapshot:
  directory: "./snapshots"
  max_repo_mb: 200
  max_count: 25
  minimum_score: 65

queries:
  - '"legal judgment prediction" dataset in:name,description,readme'
  - '"judicial decision prediction" in:name,description,readme'
  - '"court decision prediction" machine learning in:name,description,readme'
  - '"case outcome prediction" law in:name,description,readme'
  - '"legal argument mining" dataset in:name,description,readme'
  - '"legal reasoning" annotated corpus in:name,description,readme'
  - '"court judgments" annotated dataset in:name,description,readme'
  - '"legal grounds" classification in:name,description,readme'
  - '"legal NLP" benchmark in:name,description,readme'
  - '"legal NLP" transformer in:name,description,readme'
  - '"legal text classification" dataset in:name,description,readme'
  - '"legal entailment" benchmark in:name,description,readme'
  - '"legal retrieval" benchmark in:name,description,readme'
  - '"case law" dataset transformer in:name,description,readme'
  - '"court opinion" dataset neural network in:name,description,readme'
  - '"litigation outcome" prediction in:name,description,readme'
  - '"judicial behavior" machine learning in:name,description,readme'
  - '"child custody" court prediction in:name,description,readme'
