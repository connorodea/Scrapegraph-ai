[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "juricratic-research-radar"
version = "0.1.0"
description = "API-first discovery, enrichment, scoring, and local indexing of legal-AI research repositories, papers, datasets, models, and pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juricratic" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
juricratic-radar = "juricratic_radar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/juricratic_radar"]

[tool.hatch.build]
include = [
  "src/juricratic_radar/**/*.py",
  "src/juricratic_radar/data/*.yaml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
